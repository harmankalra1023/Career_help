name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check apps/api

      - name: Type check with mypy
        run: |
          mypy apps/api/app

      - name: Validate taxonomy
        run: |
          python packages/taxonomy/validator.py

      - name: Run unit tests
        run: |
          cd apps/api && pytest -v --cov=app tests/

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @dct/shared-types build || true

      - name: Next.js build
        run: |
          pnpm --filter web build
